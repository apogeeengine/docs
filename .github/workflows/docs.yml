name: Docs

# Publishes the engine's manual (MkDocs, with the Luau API the SDK generates and the changelog git-cliff writes) to
# GitHub Pages. The source is the private engine repo (read-only deploy key); the SDK is the latest release of
# apogeeengine/builds (the nightly prerelease, else the latest release). Daily, after the nightly build.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Engine branch, tag or commit
        default: main
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: apogeeengine/Apogee.Engine
          ref: ${{ inputs.ref || 'main' }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          fetch-depth: 0 # git-cliff reads the history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y libwayland-bin
          pip install "mkdocs<2" mkdocs-material git-cliff

      - name: SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=nightly
          gh release view nightly --repo apogeeengine/builds > /dev/null 2>&1 || tag=""
          gh release download $tag --repo apogeeengine/builds --pattern 'apogee-linuxbsd-sdk-x86_64.zip' --dir "$RUNNER_TEMP"
          mkdir -p Bin && unzip -q "$RUNNER_TEMP/apogee-linuxbsd-sdk-x86_64.zip" -d Bin
          chmod +x Bin/apogee.linuxbsd.sdk.x86_64

      - name: Build the site
        run: ./build.sh docs --sdk --profile release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Bin/docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
